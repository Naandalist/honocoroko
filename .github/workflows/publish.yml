# Publishes @naandalist/honocoroko when a GitHub Release is published.
# Tag MUST be vX.Y.Z and match package.json (example: v1.2.2).
#
# Auth is npm Trusted Publishing (OIDC), not NPM_TOKEN.
# Configure once on npmjs.com:
#   Package → Settings → Trusted Publisher → GitHub Actions
#   Organization or user: Naandalist
#   Repository: honocoroko
#   Workflow filename: publish.yml
#   Environment: (leave empty)
#   Allowed actions: enable direct "npm publish" (stage-only is the default)
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # No NODE_AUTH_TOKEN: npm CLI uses OIDC when the token is absent.
      - name: Publish to npm
        run: npm publish --access public
